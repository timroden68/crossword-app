<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <title>Crosswords</title>
  <meta name="robots" content="noindex">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; manifest-src 'self'; worker-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <meta name="theme-color" content="#ececee" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Crosswords">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
<div id="app">

  <section id="loading" class="view center-view"><p class="muted">Loading puzzles…</p></section>

  <!-- ============ Puzzle library ============ -->
  <section id="home" class="view" hidden>
    <header class="home-top">
      <div class="home-titles"><h1>Crosswords</h1><a class="site-link" href="https://crosswordadventures.com/" target="_blank" rel="noopener">crosswordadventures.com ↗</a></div>
      <button class="round-btn" id="homeSettingsBtn" aria-label="Settings">
        <svg viewBox="0 0 24 24"><path d="M12 15.5a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7Z"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1Z"/></svg>
      </button>
    </header>
    <div class="seg" id="filterSeg">
      <button data-f="all" class="on">All</button>
      <button data-f="new">Not started</button>
      <button data-f="progress">In progress</button>
      <button data-f="solved">Solved</button>
    </div>
    <main class="home-main" id="homeMain"></main>
  </section>

  <!-- ============ Solver ============ -->
  <section id="solver" class="view" hidden>
    <header class="sv-top">
      <button class="round-btn" id="closeBtn" aria-label="Close puzzle">
        <svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
      <div class="toolbar">
        <button class="tb" id="timerBtn" aria-label="Timer / pause">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="13.5" r="7.5"/><path d="M12 13.5V9.5M10 2.5h4M12 2.5v3.5"/></svg>
          <span id="timer"></span>
        </button>
        <button class="tb narrow-only" id="listBtn" aria-label="Clue list">
          <svg viewBox="0 0 24 24"><path d="M9 6h12M9 12h12M9 18h12"/><path d="M3.5 4.5l1-.5v4M3 13.5c.3-1 2.2-1.2 2.2 0 0 .9-2.2 1.6-2.2 2.5h2.4M3 19.6c.6.9 2.3.7 2.3-.4 0-1-1.4-1-1.4-1s1.2 0 1.2-1c0-.9-1.6-1-2-.2" stroke-width="1.3"/></svg>
        </button>
        <div class="menu">
          <button class="tb" data-menu="check" aria-label="Check and reveal">
            <svg viewBox="0 0 24 24"><path d="M20 11V7a3 3 0 0 0-3-3H7a3 3 0 0 0-3 3v10a3 3 0 0 0 3 3h4"/><circle cx="18" cy="18" r="4.2" fill="currentColor" stroke="none"/><path d="M16.2 18l1.3 1.3 2.4-2.6" stroke="var(--surface)" stroke-width="1.6"/></svg>
            <svg class="chev" viewBox="0 0 24 24"><path d="M7 10l5 5 5-5"/></svg>
          </button>
          <div class="menu-pop" id="menu-check" hidden>
            <button data-action="toggle-autocheck" class="toggle" id="autocheckItem">Autocheck</button>
            <hr>
            <button data-action="check-cell">Check Square</button>
            <button data-action="check-word">Check Word</button>
            <button data-action="check-puzzle">Check Puzzle</button>
            <hr>
            <button data-action="reveal-cell">Reveal Square</button>
            <button data-action="reveal-word">Reveal Word</button>
            <button data-action="reveal-puzzle">Reveal Puzzle</button>
          </div>
        </div>
        <div class="menu">
          <button class="tb" data-menu="more" aria-label="More">
            <svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.6" fill="currentColor"/><circle cx="12" cy="12" r="1.6" fill="currentColor"/><circle cx="19" cy="12" r="1.6" fill="currentColor"/></svg>
            <svg class="chev" viewBox="0 0 24 24"><path d="M7 10l5 5 5-5"/></svg>
          </button>
          <div class="menu-pop" id="menu-more" hidden>
            <button data-action="tips" id="tipsItem">Tips for This Puzzle</button>
            <button data-action="toggle-pencil" class="toggle" id="pencilItem">Pencil Mode</button>
            <button data-action="settings">Settings…</button>
            <hr>
            <button data-action="clear-puzzle" class="danger">Clear Puzzle</button>
          </div>
        </div>
      </div>
    </header>

    <div class="sv-sub">
      <div class="sv-title"><b id="pzTitle"></b><span id="pzMeta"></span></div>
      <div class="badge" id="solvedBadge" hidden></div>
    </div>
    <div class="hunt" id="huntNote" hidden></div>
    <div class="bank" id="bank" hidden><span class="bank-h">Word Bank</span><div class="bank-words" id="bankWords"></div></div>

    <main class="solve" id="solve">
      <div class="clue-card" id="acrossCard"><h2>Across</h2><ol id="acrossList"></ol></div>
      <div class="grid-wrap" id="gridWrap">
        <div class="grid" id="grid" role="grid"></div>
        <div class="paused" id="pausedOverlay" hidden>
          <p>Paused</p>
          <button class="pill-btn primary" id="resumeBtn">Resume</button>
        </div>
      </div>
      <div class="clue-card" id="downCard"><h2>Down</h2><ol id="downList"></ol></div>
    </main>

    <div class="cluebar" id="clueBar">
      <button class="cb-btn" id="kbToggle" aria-label="Show or hide keyboard">
        <svg viewBox="0 0 24 24"><rect x="2.5" y="5" width="19" height="12" rx="2"/><path d="M6 9h1M9 9h1M12 9h1M15 9h1M18 9h0M6 12h1M9 12h1M12 12h1M15 12h1M8 14.5h8M10 20l2 1.5 2-1.5" stroke-width="1.4"/></svg>
      </button>
      <div class="cb-text" id="clueBarText"></div>
      <button class="cb-btn" id="prevClue" aria-label="Previous clue"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
      <button class="cb-btn" id="nextClue" aria-label="Next clue"><svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg></button>
    </div>
    <div class="keyboard" id="keyboard" hidden></div>
  </section>

  <!-- ============ Sheets / toasts ============ -->
  <div class="sheet" id="sheet" hidden>
    <div class="sheet-card" role="dialog" aria-modal="true">
      <header class="sheet-head">
        <button class="round-btn small" id="sheetClose" aria-label="Close"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
        <h2 id="sheetTitle"></h2>
      </header>
      <div class="sheet-body" id="sheetBody"></div>
    </div>
  </div>
  <div class="toast" id="toast" hidden></div>
</div>
<script type="module" src="js/main.js"></script>
</body>
</html>
